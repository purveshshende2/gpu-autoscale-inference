name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install yamllint==1.38.0 pyyaml==6.0.3

      - name: yamllint
        run: yamllint k8s/ k8s-cloud/ monitoring/

      - name: Compile Python sources
        run: python -m py_compile gateway/*.py worker/*.py loadtest/locustfile.py scripts/plot_run.py
